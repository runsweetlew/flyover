<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #070b14; --card: #0d1525; --card-border: #1a2540;
      --text: #e2e8f0; --dim: #94a3b8; --muted: #64748b;
      --arriving: #3b82f6; --departing: #10b981;
      --accent: #f59e0b; --bright: #f8fafc;
      --teal: #14b8a6; --purple: #a78bfa;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; overflow: hidden;
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    /* Header */
    .header {
      padding: 0.8vh 2vw; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--card-border);
    }
    .header-left { display: flex; align-items: center; gap: 0.8rem; }
    .header-title { font-size: clamp(1.1rem,1.8vw,1.5rem); font-weight: 800; letter-spacing: 0.08em; color: var(--bright); }
    .header-sub { font-size: clamp(0.55rem,0.8vw,0.7rem); color: var(--dim); }
    .back-link {
      color: var(--arriving); text-decoration: none; font-size: clamp(0.7rem,1vw,0.85rem);
      font-weight: 600; display: flex; align-items: center; gap: 0.3rem;
      padding: 0.3rem 0.8rem; border-radius: 0.4rem; border: 1px solid rgba(59,130,246,0.25);
      background: rgba(59,130,246,0.08); transition: all 0.2s;
    }
    .back-link:hover { background: rgba(59,130,246,0.15); border-color: var(--arriving); }

    /* Filters */
    .filters {
      padding: 0.6vh 2vw; display: flex; align-items: center; gap: 0.5rem;
      border-bottom: 1px solid var(--card-border); flex-wrap: wrap;
    }
    .filter-pill {
      padding: 0.3rem 0.8rem; border-radius: 2rem; border: 1px solid var(--card-border);
      background: transparent; color: var(--dim); font-size: clamp(0.65rem,0.9vw,0.8rem);
      font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit;
      white-space: nowrap;
    }
    .filter-pill:hover { border-color: var(--teal); color: var(--teal); }
    .filter-pill.active { background: rgba(20,184,166,0.15); border-color: var(--teal); color: var(--teal); }
    .filter-pill.recurring.active { background: rgba(245,158,11,0.12); border-color: var(--accent); color: var(--accent); }
    .filter-search {
      margin-left: auto; padding: 0.3rem 0.8rem; border-radius: 0.4rem;
      border: 1px solid var(--card-border); background: var(--card); color: var(--text);
      font-size: clamp(0.65rem,0.9vw,0.8rem); font-family: inherit; width: clamp(120px,15vw,200px);
      outline: none; transition: border-color 0.2s;
    }
    .filter-search:focus { border-color: var(--teal); }
    .filter-search::placeholder { color: var(--muted); }
    .event-count {
      font-size: clamp(0.6rem,0.85vw,0.75rem); color: var(--muted); margin-left: 0.5rem;
      white-space: nowrap;
    }

    /* Main layout */
    .main { display: grid; grid-template-columns: 30fr 70fr; min-height: 0; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      background: #060a12; border-right: 1px solid var(--card-border);
      overflow-y: auto; overflow-x: hidden;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-track { background: transparent; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

    .date-group { border-bottom: 1px solid var(--card-border); }
    .date-header {
      position: sticky; top: 0; z-index: 10;
      padding: 0.5vh 1vw; font-size: clamp(0.65rem,0.9vw,0.8rem);
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
      background: var(--card); color: var(--dim); border-bottom: 1px solid var(--card-border);
    }
    .date-header.recurring { color: var(--accent); }
    .date-header .day-name { color: var(--muted); font-weight: 400; margin-left: 0.4rem; }

    .event-card {
      padding: 0.6vh 1vw; border-bottom: 1px solid rgba(20,30,50,0.4);
      cursor: pointer; transition: background 0.15s;
    }
    .event-card:hover { background: rgba(20,184,166,0.06); }
    .event-card.active { background: rgba(20,184,166,0.1); border-left: 3px solid var(--teal); }
    .ec-top { display: flex; align-items: baseline; gap: 0.4rem; }
    .ec-code {
      font-size: clamp(0.7rem,1vw,0.9rem); font-weight: 800; color: var(--teal);
      font-family: 'SF Mono', 'Courier New', monospace; letter-spacing: 0.05em;
    }
    .ec-city { font-size: clamp(0.65rem,0.9vw,0.8rem); color: var(--dim); }
    .ec-name { font-size: clamp(0.75rem,1.1vw,0.95rem); font-weight: 600; color: var(--bright); margin-top: 1px; }
    .ec-time {
      font-size: clamp(0.6rem,0.85vw,0.75rem); color: var(--muted);
      font-family: 'SF Mono', 'Courier New', monospace; margin-top: 1px;
    }
    .ec-badge {
      display: inline-block; padding: 0px 6px; border-radius: 3px;
      font-size: clamp(0.5rem,0.7vw,0.6rem); font-weight: 700; letter-spacing: 0.05em;
      text-transform: uppercase; margin-left: 0.3rem;
    }
    .ec-badge.upcoming { background: rgba(16,185,129,0.15); color: #10b981; }
    .ec-badge.today { background: rgba(245,158,11,0.15); color: var(--accent); }
    .ec-badge.multi { background: rgba(167,139,250,0.15); color: var(--purple); }
    .ec-badge.recurring-badge { background: rgba(245,158,11,0.1); color: var(--accent); }

    .no-events {
      padding: 2rem 1rem; text-align: center; color: var(--muted);
      font-size: 0.85rem; font-style: italic;
    }

    /* Map */
    .map-panel { position: relative; }
    #map { width: 100%; height: 100%; background: #0a0e17; }
    .leaflet-control-attribution { display: none !important; }
    .leaflet-control-zoom { display: none !important; }

    /* Layer toggle */
    .layer-toggle {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      display: flex; gap: 4px; background: rgba(7,11,20,0.85); padding: 4px;
      border-radius: 6px; border: 1px solid var(--card-border);
    }
    .layer-btn {
      padding: 4px 10px; border-radius: 4px; border: none;
      background: transparent; color: var(--dim); font-size: 0.7rem;
      font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.2s;
    }
    .layer-btn.active { background: rgba(20,184,166,0.2); color: var(--teal); }
    .layer-btn:hover:not(.active) { color: var(--text); }

    /* Map popup styling */
    .leaflet-popup-content-wrapper {
      background: var(--card) !important; color: var(--text) !important;
      border: 1px solid var(--card-border) !important; border-radius: 8px !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
    }
    .leaflet-popup-tip { background: var(--card) !important; border: 1px solid var(--card-border) !important; }
    .leaflet-popup-close-button { color: var(--dim) !important; }
    .leaflet-popup-close-button:hover { color: var(--text) !important; }

    .popup-header { font-size: 1rem; font-weight: 800; color: var(--bright); margin-bottom: 2px; }
    .popup-code { color: var(--teal); font-family: 'SF Mono', monospace; }
    .popup-city { font-size: 0.8rem; color: var(--dim); }
    .popup-elev { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
    .popup-divider { border: none; border-top: 1px solid var(--card-border); margin: 6px 0; }
    .popup-event { padding: 3px 0; }
    .popup-event-name { font-size: 0.8rem; font-weight: 600; color: var(--text); }
    .popup-event-date { font-size: 0.72rem; color: var(--dim); }
    .popup-event-time { font-size: 0.72rem; color: var(--muted); font-family: 'SF Mono', monospace; }
    .popup-link {
      display: inline-block; margin-top: 6px; font-size: 0.72rem;
      color: var(--arriving); text-decoration: none; font-weight: 600;
    }
    .popup-link:hover { text-decoration: underline; }

    /* Airport markers */
    .airport-marker {
      display: flex; flex-direction: column; align-items: center;
    }
    .airport-dot {
      width: 12px; height: 12px; border-radius: 50%; border: 2px solid;
      box-shadow: 0 0 6px rgba(0,0,0,0.4);
    }
    .airport-label {
      margin-top: 1px; padding: 0px 4px; border-radius: 2px;
      background: rgba(7,11,20,0.8); font-size: 10px; font-weight: 700;
      letter-spacing: 0.05em; white-space: nowrap;
      font-family: 'SF Mono', 'Courier New', monospace;
    }

    /* Summary bar */
    .summary-bar {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      z-index: 1000; display: flex; gap: 1.2rem; align-items: center;
      background: rgba(7,11,20,0.9); padding: 6px 16px; border-radius: 8px;
      border: 1px solid var(--card-border); font-size: 0.75rem; color: var(--dim);
    }
    .summary-stat { display: flex; align-items: center; gap: 0.3rem; }
    .summary-val { font-weight: 700; color: var(--bright); }

    /* Mobile */
    @media (max-width: 768px) {
      body { height: auto; min-height: 100vh; overflow-y: auto; grid-template-rows: auto auto auto; }
      .main { grid-template-columns: 1fr; grid-template-rows: 50vh auto; }
      .map-panel { order: 1; min-height: 50vh; border-right: none; }
      .sidebar { order: 2; border-right: none; border-top: 1px solid var(--card-border); max-height: 50vh; }
      .filters { padding: 6px 12px; gap: 4px; }
      .filter-search { width: 100%; margin-left: 0; margin-top: 4px; }
      .header { padding: 6px 12px; }
      .event-card { padding: 8px 12px; }
      .summary-bar { font-size: 0.65rem; padding: 4px 10px; gap: 0.8rem; }
    }
  </style>
</head>

// ════════════════════════════════════════════════════
// State
// ════════════════════════════════════════════════════
let map, currentFilter = 'all', markers = {}, activeEventId = null;
let vfrLayer, topoLayer, darkLayer, currentLayer = 'vfr';

const MICHIGAN_CENTER = [44.3, -84.7];
const MONTH_NAMES = ['', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const TODAY = new Date(); TODAY.setHours(0,0,0,0);

// ════════════════════════════════════════════════════
// Helpers
// ════════════════════════════════════════════════════
function parseDate(str) { const [y,m,d] = str.split('-').map(Number); return new Date(y, m-1, d); }

function formatDate(str) {
  const d = parseDate(str);
  return `${DAY_NAMES[d.getDay()]}, ${MONTH_NAMES[d.getMonth()+1]} ${d.getDate()}`;
}

function formatDateShort(str) {
  const d = parseDate(str);
  return `${MONTH_NAMES[d.getMonth()+1]} ${d.getDate()}`;
}

function getEventDate(e) {
  if (e.type === 'recurring') return null;
  return e.date || e.startDate;
}

function getEventMonth(e) {
  const d = getEventDate(e);
  if (!d) return null;
  return parseDate(d).getMonth() + 1;
}

function isUpcoming(e) {
  const d = getEventDate(e);
  if (!d) return false;
  const eventDate = parseDate(d);
  const diff = (eventDate - TODAY) / 86400000;
  return diff >= 0 && diff <= 14;
}

function isToday(e) {
  const d = getEventDate(e);
  if (!d) return false;
  return parseDate(d).getTime() === TODAY.getTime();
}

function isPast(e) {
  if (e.type === 'recurring') return false;
  const d = e.endDate || e.date || e.startDate;
  return parseDate(d) < TODAY;
}

function getSortKey(e) {
  if (e.type === 'recurring') return '0000-00-00';
  return e.date || e.startDate;
}

// ════════════════════════════════════════════════════
// Filtering
// ════════════════════════════════════════════════════
function getFilteredEvents() {
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  return EVENTS.filter(e => {
    // Filter by category
    if (currentFilter === 'recurring') {
      if (e.type !== 'recurring') return false;
    } else if (currentFilter !== 'all') {
      const month = parseInt(currentFilter);
      if (e.type === 'recurring') return false;
      const em = getEventMonth(e);
      if (em !== month) return false;
    }
    // Search filter
    if (search) {
      const apt = AIRPORTS[e.code] || {};
      const haystack = [e.name, e.code, apt.city, apt.name, e.time, e.recurring].filter(Boolean).join(' ').toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  renderSidebar();
  updateMarkers();
}

// ════════════════════════════════════════════════════
// Sidebar Rendering
// ════════════════════════════════════════════════════
function renderSidebar() {
  const events = getFilteredEvents();
  const sidebar = document.getElementById('sidebar');
  document.getElementById('eventCount').textContent = `${events.length} event${events.length !== 1 ? 's' : ''}`;

  if (events.length === 0) {
    sidebar.innerHTML = '<div class="no-events">No events match your filters</div>';
    return;
  }

  // Group by date
  const groups = {};
  events.sort((a, b) => getSortKey(a).localeCompare(getSortKey(b)));
  events.forEach(e => {
    const key = e.type === 'recurring' ? 'recurring' : (e.date || e.startDate);
    if (!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  let html = '';
  for (const [key, evts] of Object.entries(groups)) {
    let headerText, headerClass = '';
    if (key === 'recurring') {
      headerText = 'Weekly Events';
      headerClass = ' recurring';
    } else {
      headerText = formatDate(key);
      const d = parseDate(key);
      if (d.getTime() === TODAY.getTime()) headerText += ' <span style="color:var(--accent)">\u2022 TODAY</span>';
      else if (d > TODAY && (d - TODAY) / 86400000 <= 7) headerText += ' <span style="color:#10b981">\u2022 This Week</span>';
    }

    html += `<div class="date-group"><div class="date-header${headerClass}">${headerText}</div>`;
    evts.forEach(e => {
      const apt = AIRPORTS[e.code] || {};
      let badges = '';
      if (isToday(e)) badges += '<span class="ec-badge today">Today</span>';
      else if (isUpcoming(e)) badges += '<span class="ec-badge upcoming">Soon</span>';
      if (e.type === 'multi') badges += '<span class="ec-badge multi">Multi-Day</span>';
      if (e.type === 'recurring') badges += '<span class="ec-badge recurring-badge">' + e.recurring + '</span>';

      const dateStr = e.type === 'multi'
        ? `${formatDateShort(e.startDate)} \u2013 ${formatDateShort(e.endDate)}`
        : (e.type === 'recurring' ? '' : '');

      const pastClass = isPast(e) ? ' style="opacity:0.5"' : '';

      html += `<div class="event-card${activeEventId === e.id ? ' active' : ''}" onclick="selectEvent(${e.id})"${pastClass}>
        <div class="ec-top">
          <span class="ec-code">${e.code}</span>
          <span class="ec-city">${apt.city || ''}</span>
          ${badges}
        </div>
        <div class="ec-name">${e.name}</div>
        <div class="ec-time">${e.time}${dateStr ? ' \u2022 ' + dateStr : ''}</div>
      </div>`;
    });
    html += '</div>';
  }

  sidebar.innerHTML = html;
}

// ════════════════════════════════════════════════════
// Map Initialization
// ════════════════════════════════════════════════════
function initMap() {
  map = L.map('map', {
    zoomControl: false, attributionControl: false
  }).setView(MICHIGAN_CENTER, 7);

  // Tile layers
  vfrLayer = L.tileLayer('https://tiles.arcgis.com/tiles/ssFJjBXIUyZDrSYZ/arcgis/rest/services/VFR_Sectional/MapServer/tile/{z}/{y}/{x}', {
    minZoom: 5, maxZoom: 12,
    errorTileUrl: '',
  });

  topoLayer = L.tileLayer('https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryTopo/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16
  });

  darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    subdomains: 'abcd', maxZoom: 19
  });

  // Default to VFR chart, with dark as fallback if tiles fail
  vfrLayer.addTo(map);
  // Add dark layer underneath at low opacity as a safety net
  darkLayer.addTo(map);
  vfrLayer.setZIndex(10);
  darkLayer.setZIndex(1);

  // Add zoom control at bottom-right
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  document.querySelector('.leaflet-control-zoom').style.display = 'flex';
  document.querySelector('.leaflet-control-zoom').style.flexDirection = 'column';

  updateMarkers();
  updateSummary();
}

function setLayer(layer) {
  document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));

  map.removeLayer(vfrLayer);
  map.removeLayer(topoLayer);
  map.removeLayer(darkLayer);

  if (layer === 'vfr') {
    darkLayer.addTo(map);
    vfrLayer.addTo(map);
    vfrLayer.setZIndex(10);
    darkLayer.setZIndex(1);
    document.getElementById('btnVFR').classList.add('active');
  } else if (layer === 'topo') {
    topoLayer.addTo(map);
    document.getElementById('btnTopo').classList.add('active');
  } else {
    darkLayer.addTo(map);
    document.getElementById('btnDark').classList.add('active');
  }
  currentLayer = layer;
}

// ════════════════════════════════════════════════════
// Map Markers
// ════════════════════════════════════════════════════
function updateMarkers() {
  // Remove existing markers
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};

  const events = getFilteredEvents();

  // Group events by airport
  const byAirport = {};
  events.forEach(e => {
    if (!byAirport[e.code]) byAirport[e.code] = [];
    byAirport[e.code].push(e);
  });

  for (const [code, evts] of Object.entries(byAirport)) {
    const apt = AIRPORTS[code];
    if (!apt) continue;

    // Determine marker color based on event status
    const hasToday = evts.some(isToday);
    const hasUpcoming = evts.some(isUpcoming);
    const allRecurring = evts.every(e => e.type === 'recurring');
    const allPast = evts.every(isPast);

    let dotColor, labelColor;
    if (hasToday) { dotColor = '#f59e0b'; labelColor = '#f59e0b'; }
    else if (hasUpcoming) { dotColor = '#10b981'; labelColor = '#10b981'; }
    else if (allRecurring) { dotColor = '#f59e0b'; labelColor = '#f59e0b'; }
    else if (allPast) { dotColor = '#475569'; labelColor = '#475569'; }
    else { dotColor = '#14b8a6'; labelColor = '#14b8a6'; }

    const iconHtml = `<div class="airport-marker">
      <div class="airport-dot" style="background:${dotColor};border-color:${dotColor};"></div>
      <div class="airport-label" style="color:${labelColor}">${code}</div>
    </div>`;

    const marker = L.marker([apt.lat, apt.lon], {
      icon: L.divIcon({
        className: '', html: iconHtml,
        iconSize: [50, 28], iconAnchor: [25, 6]
      })
    }).addTo(map);

    // Build popup
    let popupHtml = `<div class="popup-header"><span class="popup-code">${code}</span> ${apt.name}</div>`;
    popupHtml += `<div class="popup-city">${apt.city}, Michigan</div>`;
    if (apt.elev) popupHtml += `<div class="popup-elev">Elevation: ${apt.elev.toLocaleString()}\u2032 MSL</div>`;
    popupHtml += '<hr class="popup-divider">';

    evts.forEach(e => {
      let dateStr = '';
      if (e.type === 'recurring') dateStr = e.recurring;
      else if (e.type === 'multi') dateStr = `${formatDateShort(e.startDate)} \u2013 ${formatDateShort(e.endDate)}`;
      else dateStr = formatDateShort(e.date);

      popupHtml += `<div class="popup-event">
        <div class="popup-event-name">${e.name}</div>
        <div class="popup-event-date">${dateStr}</div>
        <div class="popup-event-time">${e.time}</div>
      </div>`;
    });

    popupHtml += `<a class="popup-link" href="https://www.airnav.com/airport/${code}" target="_blank" rel="noopener">\u2197 Full airport info on AirNav</a>`;

    marker.bindPopup(popupHtml, { maxWidth: 280, minWidth: 200 });
    markers[code] = marker;
  }
}

function selectEvent(id) {
  activeEventId = id;
  const event = EVENTS.find(e => e.id === id);
  if (!event) return;

  const apt = AIRPORTS[event.code];
  if (!apt) return;

  // Fly to airport
  map.flyTo([apt.lat, apt.lon], 10, { duration: 0.8 });

  // Open popup
  const marker = markers[event.code];
  if (marker) marker.openPopup();

  // Update sidebar highlighting
  document.querySelectorAll('.event-card').forEach(c => c.classList.remove('active'));
  const cards = document.querySelectorAll('.event-card');
  cards.forEach(c => {
    if (c.onclick && c.onclick.toString().includes(id)) c.classList.add('active');
  });
  // Re-render to update active state
  renderSidebar();
}

function updateSummary() {
  const totalEvents = EVENTS.length;
  const totalAirports = Object.keys(AIRPORTS).length;
  const upcoming = EVENTS.filter(isUpcoming).length;
  const recurring = EVENTS.filter(e => e.type === 'recurring').length;

  document.getElementById('summaryBar').innerHTML = `
    <div class="summary-stat"><span class="summary-val">${totalEvents}</span> events</div>
    <div class="summary-stat"><span class="summary-val">${totalAirports}</span> airports</div>
    <div class="summary-stat"><span class="summary-val">${recurring}</span> weekly</div>
    ${upcoming > 0 ? `<div class="summary-stat"><span class="summary-val" style="color:#10b981">${upcoming}</span> upcoming</div>` : ''}
  `;
}

// ════════════════════════════════════════════════════
// Initialize
// ════════════════════════════════════════════════════
initMap();
renderSidebar();
</script>
